<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portion">
<meta name="theme-color" content="#14211b">
<title>Portion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout : une colonne façon balance de cuisine, l'écran de pesée (grammes) est la pièce maîtresse */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --ink: #14211b; --muted: #5d6b63; --line: #d9dfda;
  --accent: #1f7a4d; --accent-ink: #ffffff; --display-bg: #14211b; --display-ink: #b9f5cf;
  --warn: #b5581c; --p: #2f6fb5; --c: #c08a12; --f: #a8456a;
  --font-display: "Archivo", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1512; --surface: #17211c; --ink: #e6efe9; --muted: #93a39a; --line: #2a3832;
    --accent: #3fbf7f; --accent-ink: #08130d; --display-bg: #050907; --display-ink: #9df0bf;
    --warn: #f0965a; --p: #7fb2f0; --c: #e8b84a; --f: #e886ab; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1512; --surface: #17211c; --ink: #e6efe9; --muted: #93a39a; --line: #2a3832;
  --accent: #3fbf7f; --accent-ink: #08130d; --display-bg: #050907; --display-ink: #9df0bf;
  --warn: #f0965a; --p: #7fb2f0; --c: #e8b84a; --f: #e886ab; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-block: 12px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font: 800 24px/1.1 var(--font-display); margin: 0; letter-spacing: -0.01em; }
.date { font: 400 12px var(--font-mono); color: var(--muted); }
h2 { font: 700 12px var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button, .roles button {
  font: 600 14px var(--font-body); padding: 10px 6px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer;
}
.seg button small { display: block; font: 400 11px var(--font-mono); color: var(--muted); }
.seg button[aria-pressed="true"], .roles button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg button[aria-pressed="true"] small { color: var(--bg); opacity: .75; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 74px 1fr 92px; align-items: center; gap: 8px; font: 400 12px var(--font-mono); font-variant-numeric: tabular-nums; }
.bar .track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 4px; }
.bar .val { text-align: right; }
.bar .lbl { color: var(--muted); }
.btn {
  font: 700 16px var(--font-display); border: 0; border-radius: 12px; padding: 14px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); width: 100%;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 600; font-size: 14px; padding: 10px; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }
input[type="text"], input[type="number"], input[inputmode] {
  font: 400 16px var(--font-mono); padding: 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); width: 100%; min-width: 0;
}
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
#reader video { width: 100% !important; display: block; }
.product-name { font: 700 18px/1.2 var(--font-display); margin: 0; }
.product-meta { font: 400 12px var(--font-mono); color: var(--muted); }
.per100 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; font: 400 12px var(--font-mono); font-variant-numeric: tabular-nums; }
.per100 div { background: var(--bg); border-radius: 8px; padding: 6px 2px; }
.per100 b { display: block; font-size: 15px; }
.roles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.roles button { font-size: 13px; padding: 8px 4px; }
.scale {
  background: var(--display-bg); color: var(--display-ink); border-radius: 12px; padding: 16px; text-align: center;
  display: flex; flex-direction: column; gap: 4px;
}
.scale .grams { font: 600 56px/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.scale .grams span { font-size: 22px; margin-left: 4px; }
.scale .gives { font: 400 13px var(--font-mono); opacity: .85; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.note.warn { color: var(--warn); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.log li:first-child { border-top: 0; }
.log .meta { font: 400 11px var(--font-mono); color: var(--muted); }
.log .del { background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 8px; }
.log .name { min-width: 0; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
details summary { cursor: pointer; font-weight: 600; }
.targets { display: grid; grid-template-columns: 60px repeat(4, 1fr); gap: 6px; align-items: center; font: 400 12px var(--font-mono); margin-top: 10px; }
.targets input { padding: 6px; font-size: 14px; }
.error { color: var(--warn); font-size: 14px; margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Portion</h1>
    <span class="date" id="today"></span>
  </header>

  <section class="card" aria-labelledby="slot-h">
    <h2 id="slot-h">Créneau</h2>
    <div class="seg" id="slots"></div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="card" aria-labelledby="scan-h">
    <h2 id="scan-h">Produit</h2>
    <div id="reader" hidden></div>
    <button class="btn" id="scanBtn" type="button">Scanner un code-barres</button>
    <div class="row">
      <input id="codeInput" inputmode="numeric" placeholder="ou tape le code" aria-label="Code-barres">
      <button class="btn ghost" id="codeBtn" type="button" style="flex:0 0 auto;width:auto">Chercher</button>
    </div>
    <p class="error" id="err" hidden></p>
  </section>

  <section class="card" id="result" hidden aria-live="polite">
    <div>
      <p class="product-name" id="pName"></p>
      <span class="product-meta" id="pMeta"></span>
    </div>
    <div class="per100" id="per100"></div>
    <h2>Ce produit sert de</h2>
    <div class="roles" id="roles"></div>
    <div class="scale">
      <div class="grams" id="grams">0<span>g</span></div>
      <div class="gives" id="gives"></div>
    </div>
    <p class="note" id="why"></p>
    <div class="row">
      <input id="ateInput" inputmode="numeric" aria-label="Grammes mangés">
      <button class="btn" id="ateBtn" type="button">J'ai pesé ça</button>
    </div>
  </section>

  <section class="card" id="manual" hidden>
    <h2>Produit introuvable : entre les valeurs pour 100 g</h2>
    <input id="mName" type="text" placeholder="Nom du produit">
    <div class="row">
      <input id="mK" inputmode="decimal" placeholder="kcal">
      <input id="mP" inputmode="decimal" placeholder="Prot.">
      <input id="mC" inputmode="decimal" placeholder="Gluc.">
      <input id="mF" inputmode="decimal" placeholder="Lip.">
    </div>
    <button class="btn" id="mBtn" type="button">Calculer</button>
  </section>

  <section class="card" aria-labelledby="log-h">
    <h2 id="log-h">Aujourd'hui</h2>
    <ul class="log" id="log"></ul>
    <div class="bars" id="dayBars"></div>
  </section>

  <section class="card">
    <details>
      <summary>Cibles par créneau</summary>
      <div class="targets" id="targets"></div>
      <p class="note" style="margin-top:8px">Total jour : <span id="tTotal"></span></p>
    </details>
  </section>
</main>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const MACROS = [
  { k: "kcal", label: "Calories", unit: "kcal", color: "var(--accent)" },
  { k: "p", label: "Protéines", unit: "g", color: "var(--p)" },
  { k: "c", label: "Glucides", unit: "g", color: "var(--c)" },
  { k: "f", label: "Lipides", unit: "g", color: "var(--f)" },
];
// Cibles : 2 100 kcal, P 180, G 185, L 70 réparties sur 13h / 17h / 20h
const DEFAULT_SLOTS = [
  { id: "midi", name: "13h", sub: "Repas", t: { kcal: 900, p: 70, c: 85, f: 30 } },
  { id: "goûter", name: "17h", sub: "Collation", t: { kcal: 300, p: 40, c: 15, f: 10 } },
  { id: "soir", name: "20h", sub: "Repas", t: { kcal: 900, p: 70, c: 85, f: 30 } },
];
const ROLES = [
  { k: "p", label: "Protéines" },
  { k: "c", label: "Glucides" },
  { k: "f", label: "Lipides" },
  { k: "kcal", label: "Libre" },
];

const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} },
};
const dayKey = () => new Date().toLocaleDateString("fr-CA");
let slots = store.get("slots", DEFAULT_SLOTS);
let log = store.get("log-" + dayKey(), []);
let slotId = guessSlot();
let product = null;
let role = "p";
let scanner = null;

const $ = (id) => document.getElementById(id);
const r1 = (n) => Math.round(n * 10) / 10;

function guessSlot() {
  const h = new Date().getHours();
  if (h < 15) return "midi";
  if (h < 18) return "goûter";
  return "soir";
}

function eaten(filterSlot) {
  const sum = { kcal: 0, p: 0, c: 0, f: 0 };
  for (const e of log) if (!filterSlot || e.slot === filterSlot) for (const m of MACROS) sum[m.k] += e[m.k];
  return sum;
}
function remaining() {
  const t = slots.find((s) => s.id === slotId).t, e = eaten(slotId), r = {};
  for (const m of MACROS) r[m.k] = t[m.k] - e[m.k];
  return r;
}

function barsHTML(target, done) {
  return MACROS.map((m) => {
    const pct = Math.min(100, (done[m.k] / target[m.k]) * 100 || 0);
    const over = done[m.k] > target[m.k] * 1.05;
    return `<div class="bar"><span class="lbl">${m.label}</span>
      <div class="track"><div class="fill" style="width:${pct}%;background:${over ? "var(--warn)" : m.color}"></div></div>
      <span class="val">${Math.round(done[m.k])} / ${target[m.k]} ${m.unit}</span></div>`;
  }).join("");
}

function renderSlots() {
  $("slots").innerHTML = slots.map((s) =>
    `<button type="button" data-id="${s.id}" aria-pressed="${s.id === slotId}">${s.name}<small>${s.sub}</small></button>`).join("");
  const s = slots.find((x) => x.id === slotId);
  $("bars").innerHTML = barsHTML(s.t, eaten(slotId));
}

function renderLog() {
  $("log").innerHTML = log.length ? log.map((e, i) => `<li>
      <span class="name">${esc(e.name)}<br><span class="meta">${slots.find((s) => s.id === e.slot)?.name ?? ""} · ${Math.round(e.kcal)} kcal · P ${r1(e.p)} G ${r1(e.c)} L ${r1(e.f)}</span></span>
      <span class="meta">${e.g} g</span>
      <button class="del" type="button" data-i="${i}" aria-label="Supprimer">×</button></li>`).join("")
    : `<li class="empty">Rien de noté. Scanne un produit puis appuie sur « J'ai pesé ça ».</li>`;
  const total = { kcal: 0, p: 0, c: 0, f: 0 };
  for (const s of slots) for (const m of MACROS) total[m.k] += s.t[m.k];
  $("dayBars").innerHTML = barsHTML(total, eaten());
}

function renderTargets() {
  const head = `<span></span>${MACROS.map((m) => `<span>${m.k === "kcal" ? "kcal" : m.label.slice(0, 4) + "."}</span>`).join("")}`;
  $("targets").innerHTML = head + slots.map((s, i) =>
    `<span>${s.name}</span>${MACROS.map((m) => `<input inputmode="numeric" data-s="${i}" data-m="${m.k}" value="${s.t[m.k]}" aria-label="${s.name} ${m.label}">`).join("")}`).join("");
  const tot = { kcal: 0, p: 0, c: 0, f: 0 };
  for (const s of slots) for (const m of MACROS) tot[m.k] += s.t[m.k];
  $("tTotal").textContent = `${tot.kcal} kcal · P ${tot.p} g · G ${tot.c} g · L ${tot.f} g`;
}

function defaultRole(n) {
  const kp = n.p * 4, kc = n.c * 4, kf = n.f * 9;
  if (kp >= kc && kp >= kf) return "p";
  if (kc >= kf) return "c";
  return "f";
}

// Grammes = ce qu'il reste du macro visé / teneur pour 1 g, plafonné par les calories restantes
function computePortion() {
  const n = product.n, rem = remaining();
  const per = (k) => n[k] / 100;
  let g, why;
  if (role === "kcal" || per(role) <= 0) {
    g = per("kcal") > 0 ? rem.kcal / per("kcal") : 0;
    why = `Remplit les ${Math.max(0, Math.round(rem.kcal))} kcal qu'il te reste sur ce créneau.`;
  } else {
    const label = ROLES.find((r) => r.k === role).label.toLowerCase();
    g = rem[role] / per(role);
    why = `Couvre les ${Math.max(0, r1(rem[role]))} g de ${label} qu'il te reste sur ce créneau.`;
    if (per("kcal") > 0 && g * per("kcal") > rem.kcal) {
      g = rem.kcal / per("kcal");
      why = `Plafonné par les ${Math.max(0, Math.round(rem.kcal))} kcal qu'il te reste : ce produit est trop calorique pour couvrir tout le macro.`;
    }
  }
  g = Math.max(0, Math.round(g / 5) * 5);
  if (g === 0) why = "Ce créneau est déjà rempli pour ce macro. Rien à ajouter ici.";
  return { g, why };
}

function renderResult() {
  if (!product) { $("result").hidden = true; return; }
  $("result").hidden = false;
  $("pName").textContent = product.name;
  $("pMeta").textContent = [product.brand, product.code].filter(Boolean).join(" · ");
  const n = product.n;
  $("per100").innerHTML = `<div><b>${Math.round(n.kcal)}</b>kcal</div><div><b>${r1(n.p)}</b>prot.</div><div><b>${r1(n.c)}</b>gluc.</div><div><b>${r1(n.f)}</b>lip.</div>`;
  $("roles").innerHTML = ROLES.map((r) => `<button type="button" data-k="${r.k}" aria-pressed="${r.k === role}">${r.label}</button>`).join("");
  const { g, why } = computePortion();
  $("grams").innerHTML = `${g}<span>g</span>`;
  $("gives").textContent = `${Math.round(n.kcal * g / 100)} kcal · P ${r1(n.p * g / 100)} · G ${r1(n.c * g / 100)} · L ${r1(n.f * g / 100)}`;
  const raw = /riz|rice|pâtes|pasta|spaghetti|penne|fusilli|semoule|quinoa|lentilles|flocons|avoine/i.test(product.name);
  $("why").textContent = why + (raw ? " Poids sec (avant cuisson)." : "");
  $("ateInput").value = g;
}

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function showErr(msg) { $("err").textContent = msg; $("err").hidden = !msg; }

async function lookup(code) {
  code = String(code).replace(/\D/g, "");
  if (!code) return;
  showErr(""); $("manual").hidden = true;
  $("scanBtn").textContent = "Recherche…";
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_fr,brands,nutriments`);
    const data = await res.json();
    const p = data.product, nu = p?.nutriments;
    const kcal = nu?.["energy-kcal_100g"] ?? (nu?.["energy_100g"] ? nu["energy_100g"] / 4.184 : undefined);
    if (data.status !== 1 || kcal == null) {
      product = null; renderResult();
      $("manual").hidden = false; $("manual").dataset.code = code;
      showErr(data.status === 1 ? "Produit trouvé mais sans valeurs nutritionnelles." : "Produit absent d'Open Food Facts.");
      return;
    }
    product = {
      code, name: p.product_name_fr || p.product_name || "Produit sans nom", brand: (p.brands || "").split(",")[0],
      n: { kcal: +kcal, p: +(nu.proteins_100g ?? 0), c: +(nu.carbohydrates_100g ?? 0), f: +(nu.fat_100g ?? 0) },
    };
    role = defaultRole(product.n);
    renderResult();
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch {
    showErr("Pas de connexion à Open Food Facts. Réessaie ou entre les valeurs à la main.");
    $("manual").hidden = false; $("manual").dataset.code = code;
  } finally {
    $("scanBtn").textContent = "Scanner un code-barres";
  }
}

async function startScan() {
  if (scanner) return stopScan();
  if (!window.Html5Qrcode) return showErr("Le scanner n'a pas chargé. Tape le code à la main.");
  showErr("");
  $("reader").hidden = false;
  $("scanBtn").textContent = "Arrêter";
  scanner = new Html5Qrcode("reader", { formatsToSupport: [
    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E ], verbose: false });
  try {
    await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 260, height: 140 } }, async (text) => {
      await stopScan();
      if (navigator.vibrate) navigator.vibrate(60);
      $("codeInput").value = text;
      lookup(text);
    });
  } catch {
    await stopScan();
    showErr("Caméra refusée. Autorise-la dans Réglages > Safari > Caméra, ou tape le code.");
  }
}
async function stopScan() {
  if (scanner) { try { await scanner.stop(); scanner.clear(); } catch {} }
  scanner = null;
  $("reader").hidden = true;
  $("scanBtn").textContent = "Scanner un code-barres";
}

function save() { store.set("log-" + dayKey(), log); }
function refresh() { renderSlots(); renderLog(); renderResult(); }

$("slots").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  slotId = b.dataset.id; refresh();
});
$("roles").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  role = b.dataset.k; renderResult();
});
$("scanBtn").addEventListener("click", startScan);
$("codeBtn").addEventListener("click", () => lookup($("codeInput").value));
$("codeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") lookup($("codeInput").value); });
$("ateBtn").addEventListener("click", () => {
  const g = parseFloat($("ateInput").value); if (!product || !(g > 0)) return;
  const n = product.n;
  log.push({ name: product.name, slot: slotId, g, kcal: n.kcal * g / 100, p: n.p * g / 100, c: n.c * g / 100, f: n.f * g / 100 });
  save(); refresh();
});
$("log").addEventListener("click", (e) => {
  const b = e.target.closest(".del"); if (!b) return;
  log.splice(+b.dataset.i, 1); save(); refresh();
});
$("mBtn").addEventListener("click", () => {
  const v = (id) => parseFloat(String($(id).value).replace(",", ".")) || 0;
  if (!v("mK")) return showErr("Entre au moins les kcal pour 100 g.");
  product = { code: $("manual").dataset.code || "", name: $("mName").value || "Produit manuel", brand: "",
    n: { kcal: v("mK"), p: v("mP"), c: v("mC"), f: v("mF") } };
  role = defaultRole(product.n); showErr(""); $("manual").hidden = true; renderResult();
});
$("targets").addEventListener("change", (e) => {
  const i = e.target.dataset.s, m = e.target.dataset.m; if (i == null) return;
  const val = parseFloat(e.target.value); if (!(val >= 0)) return;
  slots[i].t[m] = val; store.set("slots", slots); renderTargets(); refresh();
});

$("today").textContent = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
renderTargets(); refresh();
</script>
</body>
</html>
