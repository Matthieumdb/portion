<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Portion">
<meta name="theme-color" content="#fbf3ea">
<title>Portion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout : une colonne, onglets Repas / Courses en haut, barre d'action collée en bas.
   Ambiance cuisine du dimanche : abricot, tomate, basilic, écran de balance ambré */
:root {
  --bg: #fbf3ea; --surface: #fffaf4; --ink: #33231a; --muted: #8a7466; --line: #efdccb;
  --accent: #e0592a; --accent-soft: #fde3d3; --accent-ink: #ffffff;
  --herb: #4f8a4b; --herb-soft: #e3f0dc;
  --screen: #3a2519; --screen-ink: #ffd08a;
  --warn: #c2410c; --warn-soft: #fde4d4;
  --p: #4a7fc1; --c: #e3a21a; --f: #d0577f; --k: #e0592a;
  --sA: #3f8a3c; --sB: #86b33c; --sC: #e8a317; --sD: #e3702b; --sE: #c8372d;
  --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", -apple-system, system-ui, sans-serif;
  --shadow: 0 1px 0 rgba(120, 70, 30, .06), 0 6px 18px -10px rgba(120, 70, 30, .25);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1511; --surface: #281d17; --ink: #f6e9dd; --muted: #b59d8c; --line: #3b2c23;
    --accent: #ff7a45; --accent-soft: #46271a; --accent-ink: #1d1511;
    --herb: #8cc47f; --herb-soft: #23321f;
    --screen: #120c09; --screen-ink: #ffc56b;
    --warn: #ff9a62; --warn-soft: #43261a;
    --p: #8ab6f0; --c: #f2c04f; --f: #f08fb0; --k: #ff7a45;
    --sA: #6cc06a; --sB: #a8d15a; --sC: #f2bc3d; --sD: #f58c4e; --sE: #f0675c;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1511; --surface: #281d17; --ink: #f6e9dd; --muted: #b59d8c; --line: #3b2c23;
  --accent: #ff7a45; --accent-soft: #46271a; --accent-ink: #1d1511;
  --herb: #8cc47f; --herb-soft: #23321f;
  --screen: #120c09; --screen-ink: #ffc56b;
  --warn: #ff9a62; --warn-soft: #43261a;
  --p: #8ab6f0; --c: #f2c04f; --f: #f08fb0; --k: #ff7a45;
  --sA: #6cc06a; --sB: #a8d15a; --sC: #f2bc3d; --sD: #f58c4e; --sE: #f0675c;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 600 16px/1.45 var(--font-body);
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
main { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding-block: 14px; }
.view { display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font: 700 30px/1 var(--font-display); margin: 0; color: var(--accent); }
.hello { font: 700 14px var(--font-body); color: var(--muted); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--line); border-radius: 16px; padding: 4px; gap: 4px; }
.tabs button {
  border: 0; background: transparent; color: var(--muted); border-radius: 12px; padding: 10px; cursor: pointer;
  font: 600 16px var(--font-display); display: flex; align-items: center; justify-content: center; gap: 8px;
}
.tabs button svg { width: 20px; height: 20px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.step-title { display: flex; align-items: center; gap: 10px; margin: 0; font: 600 19px var(--font-display); }
.step-title .n {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--accent); color: var(--accent-ink); font: 600 15px var(--font-display);
}
.step-title .hint { margin-left: auto; font: 700 13px var(--font-body); color: var(--muted); }
section { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.caption { font: 600 14px var(--font-body); color: var(--muted); margin: 0; }

/* Créneaux */
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slots button {
  border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 18px; padding: 12px 6px;
  font: 600 21px var(--font-display); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.slots button small { font: 700 12px var(--font-body); color: var(--muted); }
.slots button .left { font: 800 12px var(--font-body); color: var(--accent); }
.slots button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.targets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.gauge { display: flex; flex-direction: column; gap: 6px; text-align: center; min-width: 0; }
.gauge .v { font: 600 22px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.gauge .v small { font-size: 13px; margin-left: 1px; }
.gauge .l { font: 800 11px var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.fill { height: 100%; border-radius: 4px; }

/* Boutons */
.btn {
  font: 600 17px var(--font-display); border: 0; border-radius: 18px; padding: 16px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn.secondary { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.btn.small { font-size: 15px; padding: 11px 14px; width: auto; }
.btn svg { width: 22px; height: 22px; flex: none; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; min-width: 0; }
input {
  font: 700 17px var(--font-body); padding: 12px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--bg); color: var(--ink); width: 100%; min-width: 0;
}
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.reader { width: 100%; border-radius: 18px; overflow: hidden; background: #000; }
.reader video { width: 100% !important; display: block; }
.error { color: var(--warn); background: var(--warn-soft); padding: 10px 14px; border-radius: 14px; font-size: 15px; margin: 0; }
.toast { color: var(--herb); background: var(--herb-soft); padding: 10px 14px; border-radius: 14px; font-size: 15px; margin: 0; font-weight: 800; }

/* Puces */
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 12px;
  font: 700 14px var(--font-body); cursor: pointer;
}
.chip:active, .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }

/* Produits */
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.item { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; }
.thumb {
  width: 54px; height: 54px; border-radius: 16px; background: var(--accent-soft); position: relative;
  display: grid; place-items: center; font: 600 22px var(--font-display); color: var(--accent);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; background: #fff; border-radius: 16px; }
.info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.name { font: 800 16px/1.2 var(--font-body); overflow-wrap: anywhere; }
.mix { display: flex; height: 7px; border-radius: 4px; overflow: hidden; background: var(--line); }
.mix span { height: 100%; }
.sub { font: 600 13px var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; }
.icon-btn { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 8px; border-radius: 12px; }
.icon-btn svg { width: 20px; height: 20px; display: block; }
.fix { font: 800 12px var(--font-body); border: 2px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 4px 10px; cursor: pointer; white-space: nowrap; flex: 0 0 auto !important; }
.fix[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
.fix-input { width: 84px; font-size: 15px; padding: 5px 8px; flex: 0 0 auto !important; }
.empty { text-align: center; color: var(--muted); padding: 14px 8px; font-size: 15px; margin: 0; }
.empty b { color: var(--ink); display: block; font: 600 19px var(--font-display); margin-bottom: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font: 700 12px var(--font-body); color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }

/* Score */
.score { display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; font: 600 13px/1 var(--font-display); color: #fff; padding: 5px 7px; min-width: 28px; flex: 0 0 auto; }
.thumb .score { position: absolute; right: -5px; bottom: -5px; border: 2px solid var(--surface); font-size: 11px; padding: 3px 5px; min-width: 0; border-radius: 8px; }
.score-card { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.ring { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; position: relative; }
.ring::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--surface); }
.ring b { position: relative; font: 700 28px/1 var(--font-display); margin-top: -8px; }
.ring small { position: absolute; bottom: 17px; font: 800 10px var(--font-body); color: var(--muted); }
.score-label { font: 600 20px/1.15 var(--font-display); margin: 0; }
.reasons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.reasons li { display: flex; gap: 8px; align-items: baseline; }
.reasons li::before { font: 700 15px var(--font-display); width: 14px; flex: none; }
.reasons .good::before { content: "+"; color: var(--sA); }
.reasons .bad::before { content: "–"; color: var(--sE); }

/* Doses */
.doses { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.dose { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 12px; box-shadow: var(--shadow); }
.screen { background: var(--screen); color: var(--screen-ink); border-radius: 16px; padding: 8px 12px; text-align: right; min-width: 104px; }
.screen b { font: 600 32px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.screen span { font: 600 15px var(--font-display); margin-left: 3px; }
.screen.zero { background: var(--line); color: var(--muted); }
.note { font: 700 12px var(--font-body); color: var(--muted); }
.tot { display: grid; grid-template-columns: 82px 1fr 100px; gap: 10px; align-items: center; font-size: 14px; }
.tot .track { height: 12px; border-radius: 6px; }
.tot .val { text-align: right; font: 800 14px var(--font-body); font-variant-numeric: tabular-nums; }
.tot .val small { color: var(--muted); }
.verdict { display: flex; align-items: center; gap: 10px; font: 600 17px var(--font-display); margin: 0; }
.verdict .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }

/* Courses */
.big-qty { background: var(--screen); color: var(--screen-ink); border-radius: 20px; padding: 16px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
.big-qty b { font: 600 46px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.big-qty span { font: 700 14px var(--font-body); opacity: .9; }
.big-qty.extra { background: var(--warn-soft); color: var(--warn); }
.family-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.family-chips .chip { font-size: 13px; padding: 5px 10px; }
.stepper { display: flex; align-items: center; gap: 10px; background: var(--bg); border-radius: 16px; padding: 10px 12px; }
.stepper p { margin: 0; flex: 1; font-size: 14px; min-width: 0; }
.stepper button { width: 38px; height: 38px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: 600 20px var(--font-display); cursor: pointer; flex: none; }
.stepper output { font: 600 22px var(--font-display); min-width: 22px; text-align: center; }
.shop { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.shop li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px dashed var(--line); }
.shop li:first-child { border-top: 0; }
.shop li.solo { display: block; }
.shop input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--herb); padding: 0; }
.shop .q { font: 600 16px var(--font-display); white-space: nowrap; }
.shop li.done .name, .shop li.done .q { text-decoration: line-through; opacity: .5; }
.ideas { list-style: none; margin: 8px 0 4px; padding: 0; display: flex; flex-direction: column; }
.ideas li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
.ideas li:first-child { border-top: 0; }
.ideas .q { font: 700 13px var(--font-body); color: var(--muted); white-space: nowrap; }
.add-mini { border: 0; background: var(--accent-soft); color: var(--accent); width: 34px; height: 34px; border-radius: 12px; font: 600 20px var(--font-display); cursor: pointer; }
#ideas details + details { border-top: 1px solid var(--line); padding-top: 12px; }

/* Journal / réglages */
.log { list-style: none; margin: 10px 0 0; padding: 0; }
.log li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px dashed var(--line); font-size: 15px; }
.log li:first-child { border-top: 0; }
details summary { cursor: pointer; font: 600 17px var(--font-display); list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "+"; color: var(--accent); font-size: 22px; line-height: 1; }
details[open] summary::after { content: "−"; }
.tgrid { display: grid; grid-template-columns: 52px repeat(4, 1fr); gap: 6px; align-items: center; font: 800 12px var(--font-body); color: var(--muted); margin-top: 12px; }
.tgrid input { padding: 8px 4px; font-size: 15px; text-align: center; }

/* Barre d'action */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.dock .inner { max-width: 540px; margin: 0 auto; display: flex; gap: 8px; }
.dock .scan-btn { flex: 0 0 auto; width: auto; padding: 16px 18px; }
@media (prefers-reduced-motion: no-preference) {
  .dose, .item, .shop li { animation: rise .25s ease-out both; }
  @keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
}

/* Réglages */
.tabs { grid-template-columns: repeat(4, 1fr); }
.tabs button { font-size: 13px; padding: 8px 2px; gap: 2px; flex-direction: column; }
.tabs button svg { width: 21px; height: 21px; }
/* Recettes */
.recipe { gap: 12px; }
.rec-head { display: flex; align-items: center; gap: 10px; }
.rec-head h3 { margin: 0; font: 600 20px/1.15 var(--font-display); text-wrap: balance; }
.rec-n { width: 30px; height: 30px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 600 15px var(--font-display); flex: none; }
.rec-macros { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); }
.rec-macros b { font: 600 17px var(--font-display); }
.rec-macros span:first-child b { color: var(--accent); }
.rec-ing { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rec-ing li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
.rec-ing li:first-child { border-top: 0; }
.rec-ing select { padding: 7px 8px; font-size: 15px; }
.rec-g { font: 600 17px var(--font-display); text-align: right; white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; }
.rec-g .note { font-family: var(--font-body); }
.rec-steps { margin: 0; font-size: 15px; line-height: 1.5; background: var(--bg); border-radius: 14px; padding: 12px 14px; }
.rec-actions { flex-wrap: wrap; }
.rec-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: -4px; }
.rec-tags span { font: 800 12px var(--font-body); border-radius: 999px; padding: 3px 9px; background: var(--bg); color: var(--muted); }
.rec-tags .t-h { background: var(--herb-soft); color: var(--herb); }
.rec-tags .t-g { background: var(--accent-soft); color: var(--accent); }
.rec-tags .t-q { color: var(--p); }
.rec-tags .t-w { color: var(--f); }
.rec-actions .btn { flex: 1 1 auto; }
.rec-actions [aria-pressed="true"] { border-color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font: 800 12px var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
select {
  font: 700 16px var(--font-body); padding: 11px 10px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--bg); color: var(--ink); width: 100%; min-width: 0; -webkit-appearance: none; appearance: none;
}
.seg2 { display: flex; flex-wrap: wrap; gap: 6px; }
.seg2 .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.calc { background: var(--bg); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.calc .line { display: flex; justify-content: space-between; gap: 10px; }
.calc .line b { font: 600 16px var(--font-display); white-space: nowrap; }
.calc .total { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px; }
.calc .total b { font-size: 20px; color: var(--accent); }
.macro-pills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.macro-pills div { border-radius: 12px; padding: 8px 4px; background: var(--surface); }
.macro-pills b { display: block; font: 600 18px var(--font-display); }
.macro-pills small { font: 800 11px var(--font-body); color: var(--muted); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; cursor: pointer; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; padding: 0; }
.switch span { font-size: 15px; }
.slotrow { display: grid; grid-template-columns: 60px 1fr 54px 54px 36px; gap: 6px; align-items: center; }
.slotrow input { padding: 8px 6px; font-size: 15px; }
.slothead { display: grid; grid-template-columns: 60px 1fr 54px 54px 36px; gap: 6px; font: 800 11px var(--font-body); color: var(--muted); text-transform: uppercase; }
.warnline { color: var(--warn); font-size: 13px; margin: 0; }
.danger { background: var(--warn-soft); color: var(--warn); }
.diet-types { display: grid; grid-template-columns: 1fr; gap: 6px; }
.diet-types button { text-align: left; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 16px; padding: 10px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; font: 600 16px var(--font-display); }
.diet-types button small { font: 600 13px var(--font-body); color: var(--muted); }
.diet-types button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tastes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tastes li { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
.tastes li:first-child { border-top: 0; }
.tastes li.head { display: block; border-top: 0; padding: 8px 0 2px; font: 800 12px var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.taste-btn { border: 2px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 10px; font: 800 13px var(--font-body); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.taste-btn svg { width: 16px; height: 16px; }
.taste-btn.yes[aria-pressed="true"] { background: var(--herb-soft); border-color: var(--herb); color: var(--herb); }
.taste-btn.no[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.heart { color: var(--accent); font-size: 13px; margin-left: 4px; }
input[type="search"]::-webkit-search-cancel-button { cursor: pointer; }
</style>
</head>
<body>
<main>
  <header>
    <div class="top">
      <h1>Portion</h1>
      <span class="hello" id="hello"></span>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabMeal" aria-controls="mealView">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3M6 12v9M17 21V3c-2 1.5-3 4-3 7h3"/></svg><span data-i18n="tabMeal"></span></button>
      <button type="button" role="tab" id="tabShop" aria-controls="shopView">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg><span data-i18n="tabShop"></span></button>
      <button type="button" role="tab" id="tabRec" aria-controls="recView">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13.9A4 4 0 0 1 7.5 6a5 5 0 0 1 9 0A4 4 0 0 1 18 13.9V20H6z"/><path d="M6 17h12"/></svg><span data-i18n="tabRec"></span></button>
      <button type="button" role="tab" id="tabSet" aria-controls="setView">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i18n="tabSet"></span></button>
    </div>
  </header>

  <!-- ================= REPAS ================= -->
  <div class="view" id="mealView" role="tabpanel">
    <section aria-labelledby="s1">
      <h2 class="step-title" id="s1"><span class="n">1</span><span data-i18n="whichMeal"></span></h2>
      <div class="slots" id="slots"></div>
      <div class="card">
        <div class="targets" id="remaining"></div>
        <p class="caption" id="remainingCaption"></p>
      </div>
    </section>

    <section aria-labelledby="s2" id="buildView">
      <h2 class="step-title" id="s2"><span class="n">2</span><span data-i18n="whatYouEat"></span><span class="hint" id="count"></span></h2>
      <div class="reader" id="mealReader" hidden></div>
      <p class="error" id="mealErr" hidden></p>
      <p class="toast" id="mealToast" hidden></p>
      <div class="card">
        <ul class="items" id="items"></ul>
        <div class="legend" id="legend" hidden><span><i style="background:var(--p)"></i><span data-i18n="protein"></span></span><span><i style="background:var(--c)"></i><span data-i18n="carbs"></span></span><span><i style="background:var(--f)"></i><span data-i18n="fat"></span></span></div>
      </div>
      <div class="card">
        <span class="caption" data-i18n="noBarcode"></span>
        <div class="quick" id="quick"></div>
        <div class="row">
          <input id="mealCode" inputmode="numeric" data-i18n-ph="manualCode" aria-label="Code">
          <button class="btn secondary small" id="mealCodeBtn" type="button" style="flex:0 0 auto" data-i18n="add"></button>
        </div>
      </div>
    </section>

    <section aria-labelledby="s3" id="resultView" hidden>
      <h2 class="step-title" id="s3"><span class="n">3</span><span data-i18n="yourDoses"></span></h2>
      <ul class="doses" id="doses"></ul>
      <div class="card" id="totals"></div>
    </section>

    <section>
      <div class="card">
        <details>
          <summary id="logh"></summary>
          <ul class="log" id="log"></ul>
        </details>
      </div>
    </section>
  </div>

  <!-- ================= COURSES ================= -->
  <div class="view" id="shopView" role="tabpanel" hidden>
    <section>
      <div class="card" id="shopIntro">
        <p class="score-label" style="font-size:19px" data-i18n="shopIntroT"></p>
        <p class="caption" data-i18n="shopIntroD"></p>
      </div>
      <div class="reader" id="shopReader" hidden></div>
      <p class="error" id="shopErr" hidden></p>
      <p class="toast" id="shopToast" hidden></p>
      <div class="row">
        <input id="shopCode" inputmode="numeric" data-i18n-ph="manualCode" aria-label="Code">
        <button class="btn secondary small" id="shopCodeBtn" type="button" style="flex:0 0 auto" data-i18n="search"></button>
      </div>
    </section>

    <section id="shopResult" hidden aria-live="polite"></section>

    <section aria-labelledby="listh">
      <h2 class="step-title" id="listh"><span data-i18n="weekList"></span><span class="hint" id="shopCount"></span></h2>
      <div class="card">
        <ul class="shop" id="shopList"></ul>
        <button class="btn secondary small" id="clearShop" type="button" hidden style="align-self:flex-start" data-i18n="clearList"></button>
      </div>
    </section>

    <section aria-labelledby="ideash">
      <h2 class="step-title" id="ideash" data-i18n="goodChoices"></h2>
      <p class="caption" data-i18n="goodChoicesD"></p>
      <div class="card" id="ideas"></div>
    </section>
  </div>

  <!-- ================= RECETTES ================= -->
  <div class="view" id="recView" role="tabpanel" hidden>
    <section>
      <div class="card">
        <div class="stepper" style="background:transparent;padding:0">
          <p class="score-label" style="font-size:18px" data-i18n="recHowMany"></p>
          <button type="button" id="recMinus" aria-label="−">−</button><output id="recN"></output><button type="button" id="recPlus" aria-label="+">+</button>
        </div>
        <div class="field"><span data-i18n="recFor"></span><div class="seg2" id="recSlots"></div></div>
        <div class="field"><span data-i18n="recStyle"></span><div class="seg2" id="recStyles"></div></div>
        <button class="btn" type="button" id="recGo"></button>
        <p class="caption" data-i18n="recHint"></p>
      </div>
    </section>
    <section id="recList"></section>
    <button class="btn secondary" type="button" id="recShop" hidden data-i18n="recToShop"></button>
    <p class="toast" id="recToast" hidden></p>
  </div>

  <!-- ================= RÉGLAGES ================= -->
  <div class="view" id="setView" role="tabpanel" hidden>
    <section>
      <h2 class="step-title" data-i18n="setProfile"></h2>
      <div class="card">
        <label class="field"><span data-i18n="firstName"></span><input id="pName" autocomplete="given-name" style="font-family:var(--font-body)"></label>
        <div class="field"><span data-i18n="sex"></span>
          <div class="seg2" id="pSex"><button class="chip" type="button" data-v="m" data-i18n="male"></button><button class="chip" type="button" data-v="f" data-i18n="female"></button></div>
        </div>
        <div class="grid3">
          <label class="field"><span data-i18n="age"></span><input id="pAge" inputmode="numeric"></label>
          <label class="field"><span id="pHeightL"></span><input id="pHeight" inputmode="decimal"></label>
          <label class="field"><span id="pWeightL"></span><input id="pWeight" inputmode="decimal"></label>
        </div>
        <label class="field"><span data-i18n="activity"></span><select id="pAct"></select></label>
        <label class="field"><span data-i18n="goal"></span><select id="pGoal"></select></label>
        <div class="grid2">
          <label class="field"><span id="pProtL"></span><input id="pProt" inputmode="decimal"></label>
          <label class="field"><span id="pFatL"></span><input id="pFat" inputmode="decimal"></label>
        </div>
        <div class="calc" id="calc"></div>
        <label class="switch"><span data-i18n="manualTargets"></span><input type="checkbox" id="manualOn"></label>
        <div class="grid2" id="manualBox" hidden>
          <label class="field"><span>kcal</span><input id="mKcal" inputmode="numeric"></label>
          <label class="field"><span data-i18n="protein"></span><input id="mP" inputmode="numeric"></label>
          <label class="field"><span data-i18n="carbs"></span><input id="mC" inputmode="numeric"></label>
          <label class="field"><span data-i18n="fat"></span><input id="mF" inputmode="numeric"></label>
        </div>
      </div>
    </section>

    <section>
      <h2 class="step-title" data-i18n="setMeals"></h2>
      <div class="card">
        <p class="caption" data-i18n="setMealsD"></p>
        <div class="slothead"><span data-i18n="mealTime"></span><span data-i18n="mealName"></span><span>% kcal</span><span>% prot.</span><span></span></div>
        <div id="slotRows" style="display:flex;flex-direction:column;gap:6px"></div>
        <p class="warnline" id="slotWarn" hidden></p>
        <button class="btn secondary small" type="button" id="addSlot" style="align-self:flex-start" data-i18n="addMeal"></button>
        <div id="slotPreview" class="calc"></div>
      </div>
    </section>

    <section>
      <h2 class="step-title" data-i18n="setDiet"></h2>
      <div class="card" id="diet"></div>
    </section>

    <section>
      <h2 class="step-title" data-i18n="setTastes"></h2>
      <div class="card">
        <p class="caption" data-i18n="setTastesD"></p>
        <input id="tasteSearch" type="search" data-i18n-ph="searchFood" autocomplete="off" style="font-family:var(--font-body)">
        <ul class="tastes" id="tastes"></ul>
        <button class="btn secondary small" type="button" id="copyTastes" style="align-self:flex-start" data-i18n="copyTastes"></button>
      </div>
    </section>

    <section>
      <h2 class="step-title" data-i18n="setDisplay"></h2>
      <div class="card">
        <div class="field"><span data-i18n="language"></span>
          <div class="seg2" id="sLang"><button class="chip" type="button" data-v="fr">Français</button><button class="chip" type="button" data-v="en">English</button></div></div>
        <div class="field"><span data-i18n="units"></span>
          <div class="seg2" id="sUnits"><button class="chip" type="button" data-v="metric" data-i18n="metric"></button><button class="chip" type="button" data-v="imperial" data-i18n="imperial"></button></div></div>
        <div class="field"><span data-i18n="theme"></span>
          <div class="seg2" id="sTheme"><button class="chip" type="button" data-v="auto" data-i18n="themeAuto"></button><button class="chip" type="button" data-v="light" data-i18n="themeLight"></button><button class="chip" type="button" data-v="dark" data-i18n="themeDark"></button></div></div>
      </div>
    </section>

    <section>
      <h2 class="step-title" data-i18n="setData"></h2>
      <div class="card">
        <p class="caption" data-i18n="setDataD"></p>
        <div class="row" style="flex-wrap:wrap">
          <button class="btn secondary small" type="button" id="exportBtn" data-i18n="export"></button>
          <button class="btn secondary small" type="button" id="clearLogBtn" data-i18n="clearToday"></button>
          <button class="btn small danger" type="button" id="resetBtn" data-i18n="resetAll"></button>
        </div>
      </div>
    </section>
  </div>
</main>

<div class="dock">
  <div class="inner" id="dockBuild">
    <button class="btn secondary scan-btn" id="mealScanBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg><span data-i18n="scan"></span></button>
    <button class="btn" id="calcBtn" type="button" disabled></button>
  </div>
  <div class="inner" id="dockResult" hidden>
    <button class="btn secondary" id="backBtn" type="button" style="flex:0 0 38%" data-i18n="edit"></button>
    <button class="btn" id="ateBtn" type="button" data-i18n="ateIt"></button>
  </div>
  <div class="inner" id="dockShop" hidden>
    <button class="btn" id="shopScanBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg><span data-i18n="scanProduct"></span></button>
  </div>
</div>

function computeTargets() {
  const p = S.profile;
  const bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === "f" ? -161 : 5);
  const tdee = bmr * ACT[p.act];
  const kcal = Math.round((tdee + GOAL[p.goal]) / 50) * 50;
  const prot = Math.round(p.protKg * p.weight);
  const fat = Math.round(p.fatKg * p.weight);
  const carbs = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
  return { bmr, tdee, kcal, p: prot, c: carbs, f: fat };
}
function dayTargets() {
  if (S.manual.on) return { kcal: +S.manual.kcal || 0, p: +S.manual.p || 0, c: +S.manual.c || 0, f: +S.manual.f || 0 };
  const c = computeTargets();
  return { kcal: c.kcal, p: c.p, c: c.c, f: c.f };
}
// Chaque repas reçoit sa part de calories et de protéines ; le reste des calories est partagé glucides / lipides au prorata de la journée
function slotList() {
  const T = dayTargets();

  const sp = S.slots.reduce((a, s) => a + (+s.pp || 0), 0) || 1;
  const cK = T.c * 4, fK = T.f * 9, cShare = cK + fK ? cK / (cK + fK) : 0.5;
  return S.slots.map((s) => {
    const kcal = T.kcal * (+s.pk || 0) / sk;
    const p = T.p * (+s.pp || 0) / sp;
    const rest = Math.max(0, kcal - p * 4);
    return { id: s.id, name: s.time, sub: s.name, t: { kcal: r0(kcal), p: r0(p), c: r0(rest * cShare / 4), f: r0(rest * (1 - cShare) / 9) } };
  });
}

}

}

/* ================= Exclusions du régime ================= */
const SEAFOOD = /seafood|fishes|(^|\s|:)fish|shellfish|crustacean|salmon|shrimp|prawn|mussel|sardine|mackerel|(^|\s|:)cod|saumon|crevette|moule|maquereau|cabillaud|surimi|poisson/;
const TUNA = /tuna|thon/;
const MEAT = /meats|poultry|chicken|beef|turkey|hams|sausages|poulet|boeuf|bœuf|dinde|jambon|viande|steak|saucisse|lardon|bacon/;
const PORK = /pork|hams|bacon|porc|jambon|lardon|saucisson|chorizo/;
function hayOf(p) { return ((p.cats || []).join(" ") + " " + (p.allergens || []).join(" ") + " " + (p.name || p.fr || "")).toLowerCase(); }
const pref = (f) => (f && f.id ? S.prefs[f.id] || 0 : 0);
const has = (p, re) => re.test(hayOf(p));
function excludedBy(p) {
  const d = S.diet, tags = p.tags, al = p.allergens || [];
  // Aliment de la base : on lit ses tags ; produit scanné : catégories, allergènes et analyse des ingrédients
  const isTuna = tags ? tags.includes("tuna") : has(p, TUNA);
  const isSea = tags ? tags.includes("seafood") : (has(p, SEAFOOD) && !has(p, TUNA)) || al.some((a) => /crustacean|mollusc/.test(a));
  const isFish = tags ? tags.includes("fish") : isTuna || isSea || al.includes("en:fish");
  const isMeat = tags ? tags.includes("meat") : has(p, MEAT) || has(p, PORK);
  const isPork = tags ? tags.includes("pork") : has(p, PORK);
  const isDairy = tags ? tags.includes("dairy") : al.includes("en:milk") || has(p, /dairies|cheeses|yogurt|milks/);
  const isEgg = tags ? tags.includes("egg") : al.includes("en:eggs") || has(p, /(^|\s|:)eggs/);
  const nonVegan = (p.analysis || []).includes("en:non-vegan");
  if (d.type === "vegan") { if (isMeat) return "meat"; if (isFish) return "fish"; if (isDairy) return "dairy"; if (isEgg) return "egg"; if (nonVegan) return "animal"; }
  if (d.type === "veg") { if (isMeat) return "meat"; if (isFish) return "fish"; }
  if (d.type === "pesc" && isMeat) return "meat";
  if (d.type === "nopork" && isPork) return "pork";
  if (d.seafood && (isSea || (isFish && !(d.tuna && isTuna)))) return "seafood";

/* ================= Score nutritionnel ================= */
function scoreOf(p) {
  const ex = excludedBy(p);
  if (ex) return { s: 5, ex, reasons: [{ bad: true, t: t("rExcluded", t("dietWord")[ex]) }] };
  if (pref(p) === -1 && !scoreOf.inner) { scoreOf.inner = true; const r = scoreOf(p); scoreOf.inner = false; r.reasons = [{ bad: true, t: t("youDislike") }, ...r.reasons].slice(0, 4); return r; }
  const n = p.n, kcal = Math.max(n.kcal, 1);
  const reasons = [];
  let s = 50;
  const pShare = (n.p * 4) / kcal;
  s += Math.min(30, pShare * 75);
  if (pShare >= 0.3) reasons.push({ t: t("rProt", r0(Math.min(100, pShare * 100))) });
  else if (pShare < 0.08 && n.kcal > 150 && !["feculents", "graisses", "fruits", "legumes"].includes(p.fam)) { s -= 8; reasons.push({ bad: true, t: t("rLowProt") }); }
  const fiber = n.fiber ?? 0;
  if (fiber >= 5) { s += 8; reasons.push({ t: t("rFiber", fr(fiber)) }); } else if (fiber >= 3) s += 4;
  const sugar = n.sugar ?? 0;
  const natural = ["fruits", "laitiers", "legumes"].includes(p.fam) && sugar <= 15;
  if (!natural && sugar > 5) { s -= Math.min(28, (sugar - 5) * 1.2); reasons.push({ bad: true, t: t(sugar >= 12 ? "rVSugar" : "rSugar", fr(sugar)) }); }
  const sat = n.sat ?? 0, satLimit = p.fam === "graisses" ? 18 : 4;
  if (sat > satLimit) { s -= Math.min(15, (sat - satLimit) * 1.2); if (sat >= 8 && p.fam !== "graisses") reasons.push({ bad: true, t: t("rSat", fr(sat)) }); }
  const salt = n.salt ?? 0;
  if (salt > 1.2) { s -= Math.min(15, (salt - 1.2) * 6); if (salt >= 1.5) reasons.push({ bad: true, t: t("rSalt", fr(salt)) }); }
  if (p.nova === 1) { s += 12; reasons.push({ t: t("rRaw") }); } else if (p.nova === 2) s += 6;
  else if (p.nova === 4) { s -= 12; reasons.push({ bad: true, t: t("rUltra") }); }
  if ((p.additives ?? 0) >= 4) { s -= 5; reasons.push({ bad: true, t: t("rAdd", p.additives) }); }
  if (n.kcal >= 400 && pShare < 0.15 && fiber < 5 && p.fam !== "graisses" && p.fam !== "feculents") { s -= 10; reasons.push({ bad: true, t: t("rDense", r0(n.kcal)) }); }
  if (p.fam === "graisses") reasons.push({ bad: true, t: t("rSpoon") });
  s = Math.max(0, Math.min(100, Math.round(s)));
  reasons.sort((a, b) => (!!a.bad === !!b.bad ? 0 : a.bad ? 1 : -1));
  return { s, reasons: reasons.slice(0, 4) };
}
function grade(s) {

  if (s >= 65) return { l: "B", c: "var(--sB)", t: t("gB") };
  if (s >= 45) return { l: "C", c: "var(--sC)", t: t("gC") };

/* ================= Rayon d'un produit scanné ================= */
function familyOf(p) {
  const hay = hayOf(p), n = p.n, sugar = n.sugar ?? 0;
  if (/alcoholic|beers|wines|spirits|sodas|soft-drinks|sweetened-beverages|energy-drinks|confectioner|chocolate|candies|biscuits|cookies|cakes|pastries|ice-cream|sweet-snacks|salty-snacks|crisps|desserts|pizzas|bonbon|gâteau|biscuit|chips|soda/.test(hay)) {
    if (/greek|skyr|fromage-blanc|cottage/.test(hay) && sugar < 6) return "laitiers";
    return "extras";
  }
  if (TUNA.test(hay)) return "viandes";
  if (/protein-powder|whey|dietary-supplement|protéine en poudre/.test(hay)) return "poudre";
  if (/(^|\s|:)eggs|œuf|oeuf/.test(hay)) return "oeufs";
  if (/yogurt|yoghurt|skyr|fromages-blancs|fromage blanc|cottage|quark|(^|:)milks|lait /.test(hay)) return sugar > 9 ? "extras" : "laitiers";
  if (/cheeses|fromage|mozzarella|parmesan|emmental|cheddar/.test(hay)) return "fromages";
  if (MEAT.test(hay) || PORK.test(hay) || /tofu|tempeh|seitan/.test(hay)) return "viandes";
  if (/olive-oils|vegetable-oils|(^|:)fats|butters|nuts|peanut|almond|huile|beurre|amande|cacahu|noix|avocado/.test(hay)) return "graisses";
  if (/sauces|condiments|mustards|ketchup|spices|salsa|sauce|moutarde|épice/.test(hay)) return "sauces";
  if (/breakfast-cereals/.test(hay) && sugar > 12) return "extras";
  if (/fruit-juices|nectars|compotes|(^|\s)jus/.test(hay)) return "extras";
  if (/rices|pastas|potatoes|breads|oat|cereals|couscous|semolin|quinoa|legumes|lentil|tortilla|wraps|riz|pâtes|pates|pomme de terre|patate|pain|avoine|semoule|lentille/.test(hay)) return "feculents";
  if (/vegetables|légume|legume/.test(hay)) return "legumes";
  if (/fruits|banane|kiwi/.test(hay)) return "fruits";
  const kp = n.p * 4, kc = n.c * 4, kf = n.f * 9;
  if (sugar > 15 || (kf > kp && kf > kc && n.p < 10 && n.kcal > 350)) return "extras";

  if (kc >= kp && kc >= kf) return "feculents";
  if (kf >= kp && kf >= kc) return "graisses";
  return "extras";

function famBudget(fam) { const F = FAMILIES[fam]; return F.budget * scaleFor(F.by); }
function weeklyQty(p, fam) {
  const F = FAMILIES[fam];
  const n = Math.max(1, variety[fam] ?? F.n);
  const budget = famBudget(fam), share = budget / n;
  if (fam === "extras") {
    const g = p.n.kcal > 0 ? (share / p.n.kcal) * 100 : 0;
    return { g, n, how: t("extrasHow", r0(budget / 50) * 50) };
  }
  let g;
  if (F.by === "g") g = share;
  else { const per = p.n[F.by]; g = per > 0 ? (share / per) * 100 : share; }
  const total = F.by === "g" ? t("planTotalW", fmtWeight(budget), famLabel(fam).toLowerCase())
    : t("planTotalN", r0(budget), mLabel(F.by).toLowerCase());
  const also = t("also")[fam] || "";
  return { g, n, how: n > 1 ? t("splitHow", total, n, also) : t("soloHow", total) };
}
function fmtWeight(g) {
  if (S.units === "imperial") {
    const oz = g / 28.35;

  }

}

/* ================= Calcul des doses (Repas) =================
   Moindres carrés pondérés, grammes ≥ 0 : la somme des produits colle au reste du créneau
   en kcal, protéines (comptées double), glucides et lipides. Les quantités fixes sont déduites avant,
   les produits à l'unité (œufs, cuillères) sont arrondis puis le reste est recalculé autour. */
function solve(items, target, round = false) {
  const keys = ["kcal", "p", "c", "f"];
  const w = { kcal: 1, p: 2, c: 1, f: 1 };
  const tg = { ...target };
  for (const it of items) if (it.fixed != null) for (const k of keys) tg[k] -= it.n[k] * it.fixed / 100;
  const free = items.map((it, i) => ({ it, i })).filter((x) => x.it.fixed == null);
  const scale = {};
  for (const k of keys) scale[k] = Math.max(Math.abs(target[k]), k === "kcal" ? 100 : 5);
  const A = free.map(({ it }) => keys.map((k) => (it.n[k] / 100) * Math.sqrt(w[k]) / scale[k]));
  const b = keys.map((k) => tg[k] * Math.sqrt(w[k]) / scale[k]);
  const g = free.map(() => 0);
  for (let iter = 0; iter < 4000; iter++) {
    let moved = 0;
    for (let j = 0; j < g.length; j++) {
      let num = 0, den = 1e-6;
      for (let m = 0; m < 4; m++) {
        let others = 0;
        for (let q = 0; q < g.length; q++) if (q !== j) others += A[q][m] * g[q];
        num += A[j][m] * (b[m] - others);
        den += A[j][m] * A[j][m];
      }
      const next = Math.min(MAX_G, Math.max(0, num / den));
      moved = Math.max(moved, Math.abs(next - g[j]));
      g[j] = next;
    }
    if (moved < 0.01) break;
  }
  const units = free.filter(({ it }) => it.unit);
  if (units.length && units.length < free.length && !round) {
    const fixedItems = items.map((it, i) => {
      const j = free.findIndex((x) => x.i === i);
      return j >= 0 && it.unit ? { ...it, fixed: roundDose(g[j], it) } : it;
    });
    return solve(fixedItems, target, true);
  }
  const out = items.map((it) => (it.fixed != null ? it.fixed : 0));
  free.forEach(({ i }, j) => { out[i] = roundDose(g[j], items[i]); });
  return out;
}
function roundDose(g, it) {
  if (it.unit) return Math.round(g / it.unit.step) * it.unit.step;
  return g >= 100 ? Math.round(g / 5) * 5 : Math.round(g);
}

/* ================= Open Food Facts ================= */
async function fetchProduct(code) {
  const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_fr,product_name_en,brands,nutriments,image_front_small_url,nova_group,additives_n,categories_tags,allergens_tags,ingredients_analysis_tags,product_quantity`);
  const data = await res.json();
  const p = data.product, nu = p?.nutriments;
  const kcal = nu?.["energy-kcal_100g"] ?? (nu?.["energy_100g"] ? nu["energy_100g"] / 4.184 : undefined);
  const local = S.lang === "fr" ? p?.product_name_fr : p?.product_name_en;
  if (data.status !== 1 || kcal == null) return { missing: true, name: local || p?.product_name || "" };
  const item = {
    code, name: local || p.product_name || p.product_name_fr || t("noName"), brand: (p.brands || "").split(",")[0].trim(),
    img: p.image_front_small_url || "", nova: p.nova_group ?? null, additives: p.additives_n ?? 0,
    cats: p.categories_tags || [], allergens: p.allergens_tags || [], analysis: p.ingredients_analysis_tags || [], packG: +p.product_quantity || 0,
    n: { kcal: +kcal, p: +(nu.proteins_100g ?? 0), c: +(nu.carbohydrates_100g ?? 0), f: +(nu.fat_100g ?? 0),
      sugar: +(nu.sugars_100g ?? 0), sat: +(nu["saturated-fat_100g"] ?? 0), salt: +(nu.salt_100g ?? 0), fiber: +(nu.fiber_100g ?? 0) },
  };
  item.fam = familyOf(item);
  return item;
}
async function lookup(code, where) {
  code = String(code).replace(/\D/g, "");
  if (!code) return;
  const err = where === "meal" ? "mealErr" : "shopErr";
  showErr(err, "");
  try {
    const item = await fetchProduct(code);
    if (item.missing) return showErr(err, item.name ? t("noValues", item.name) : t("notInOFF"));
    if (where === "meal") { addToCart(item); $("mealCode").value = ""; }
    else { shopItem = item; renderShopResult(); $("shopCode").value = ""; $("shopResult").scrollIntoView({ behavior: "smooth", block: "start" }); }
  } catch {
    showErr(err, t("offline"));
  }
}

/* ================= Scanner ================= */
async function startScan(where) {
  if (scanner) { const same = scanner.where === where; await stopScan(); if (same) return; }
  const readerId = where === "meal" ? "mealReader" : "shopReader";
  const err = where === "meal" ? "mealErr" : "shopErr";
  if (!window.Html5Qrcode) return showErr(err, t("noScanner"));
  showErr(err, "");
  if (where === "meal") { doses = null; renderResult(); } else { shopItem = null; renderShopResult(); }
  $(readerId).hidden = false;
  $(readerId).scrollIntoView({ behavior: "smooth", block: "start" });
  scanner = new Html5Qrcode(readerId, { formatsToSupport: [
    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E ], verbose: false });
  scanner.where = where; scanner.readerId = readerId;
  try {
    await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 260, height: 140 } }, async (text) => {
      await stopScan();
      if (navigator.vibrate) navigator.vibrate(60);
      lookup(text, where);
    });
  } catch {
    await stopScan();
    showErr(err, t("camDenied"));
  }
}
async function stopScan() {
  if (!scanner) return;
  const id = scanner.readerId;
  try { await scanner.stop(); scanner.clear(); } catch {}
  scanner = null;
  $(id).hidden = true;
}

  const b = e.target.closest("[data-rstyle]"); if (!b) return;
  const k = b.dataset.rstyle;
  let styles = store.get("recipeStyles", []);
  styles = !k ? [] : styles.includes(k) ? styles.filter((x) => x !== k) : [...styles, k];
  store.set("recipeStyles", styles); renderRecipes();
});
$("recList").addEventListener("click", (e) => {
  const R = store.get("recipes", null); if (!R) return;
  const slotT = (slotList().find((s) => s.id === R.slot) || slotList()[0]).t;
  const ch = e.target.closest("[data-rchange]");
  if (ch) {
    const i = +ch.dataset.rchange;
    const fresh = drawRecipes(1, slotT, R.items.map((x) => x.tpl))[0];
    if (fresh) R.items[i] = fresh;
    store.set("recipes", R); recipeEdit = null; renderRecipes(); return;
  }
  const ed = e.target.closest("[data-redit]");
  if (ed) { const i = +ed.dataset.redit; recipeEdit = recipeEdit === i ? null : i; renderRecipes(); return; }
  const ck = e.target.closest("[data-rcook]");
  if (ck) {
    const { items } = buildRecipe(R.items[+ck.dataset.rcook], slotT);
    cart = items.filter((it) => it.g > 0).map((it) => ({ foodId: it.food.id, name: it.food[S.lang], fr: it.food.fr, en: it.food.en, fam: it.food.fam, tags: it.food.tags, nova: it.food.nova, unit: it.food.unit, n: { ...it.food.n }, fixed: it.g }));
    slotId = R.slot; doses = solve(cart, remaining());
    tab = "meal"; renderSlots(); renderCart(); renderResult(); renderTabs(); window.scrollTo({ top: 0 });
  }
});
$("recList").addEventListener("change", (e) => {
  const sel = e.target.closest("select[data-rec]"); if (!sel) return;
  const R = store.get("recipes", null);
  R.items[+sel.dataset.rec].picks[+sel.dataset.part] = sel.value;
  store.set("recipes", R); renderRecipes();
});
$("recShop").addEventListener("click", () => {
  const R = store.get("recipes", null); if (!R) return;
  const slotT = (slotList().find((s) => s.id === R.slot) || slotList()[0]).t;
  const sum = new Map();
  for (const rec of R.items) for (const it of buildRecipe(rec, slotT).items) if (it.g > 0) sum.set(it.food.id, (sum.get(it.food.id) || 0) + it.g);
  for (const [id, g] of sum) {
    const f = FOODS.find((x) => x.id === id);
    const ref = { foodId: f.id, name: f[S.lang], fr: f.fr, en: f.en, n: f.n, packG: 0, unit: f.unit };
    const i = shopList.findIndex((x) => x.ref && x.ref.foodId === id);
    if (i >= 0 && shopList[i].fixedG != null) shopList[i].fixedG += g;
    else if (i >= 0) shopList[i] = { fam: f.fam, ref, fixedG: g, done: false };
    else shopList.push({ fam: f.fam, ref, fixedG: g, done: false });
  }
  renderShopList();
  flash("recToast", t("recAdded", sum.size));
});

/* ================= Événements : Réglages ================= */
const num = (v) => parseFloat(String(v).replace(",", "."));
function onTargetsChanged() { saveSettings(); renderCalc(); renderSlotPreview(); renderSlots(); renderIdeas(); renderShopList(); if (doses) { doses = solve(cart, remaining()); renderResult(); } }
$("pName").addEventListener("input", (e) => { S.profile.name = e.target.value.trim(); saveSettings(); applyLang(); });
$("pSex").addEventListener("click", (e) => {
  const b = e.target.closest("[data-v]"); if (!b) return;
  S.profile.sex = b.dataset.v; for (const x of $("pSex").children) x.setAttribute("aria-pressed", x === b); onTargetsChanged();
});
for (const id of ["pAge", "pHeight", "pWeight", "pProt", "pFat"]) {
  $(id).addEventListener("input", (e) => {
    const v = num(e.target.value); if (!(v > 0)) return;
    const p = S.profile;
    if (id === "pAge") p.age = v;
    if (id === "pHeight") p.height = isImp() ? v * 2.54 : v;
    if (id === "pWeight") p.weight = isImp() ? v / 2.2046 : v;
    if (id === "pProt") p.protKg = isImp() ? v * 2.2046 : v;
    if (id === "pFat") p.fatKg = isImp() ? v * 2.2046 : v;
    onTargetsChanged();
  });
}
$("pAct").addEventListener("change", (e) => { S.profile.act = +e.target.value; onTargetsChanged(); });
$("pGoal").addEventListener("change", (e) => { S.profile.goal = +e.target.value; onTargetsChanged(); });
$("manualOn").addEventListener("change", (e) => {
  S.manual.on = e.target.checked;
  if (S.manual.on) { const c = computeTargets(); Object.assign(S.manual, { kcal: c.kcal, p: c.p, c: c.c, f: c.f }); renderSettings(); }
  $("manualBox").hidden = !S.manual.on; onTargetsChanged();
});
for (const [id, k] of [["mKcal", "kcal"], ["mP", "p"], ["mC", "c"], ["mF", "f"]]) {
  $(id).addEventListener("input", (e) => { const v = num(e.target.value); if (v >= 0) { S.manual[k] = v; onTargetsChanged(); } });
}
$("slotRows").addEventListener("input", (e) => {
  const i = e.target.dataset.slot; if (i == null) return;
  const k = e.target.dataset.k;
  S.slots[+i][k] = k === "pk" || k === "pp" ? (num(e.target.value) || 0) : e.target.value;
  saveSettings(); renderSlotPreview(); renderSlots(); renderCalc();
});
$("slotRows").addEventListener("click", (e) => {
  const b = e.target.closest("[data-slotdel]"); if (!b || S.slots.length < 2) return;
  S.slots.splice(+b.dataset.slotdel, 1); saveSettings(); renderSlotEditor(); renderSlots(); renderCalc();
});
$("addSlot").addEventListener("click", () => {
  S.slots.push({ id: "s" + Date.now(), time: "10h", name: S.lang === "fr" ? "Collation" : "Snack", pk: 10, pp: 10 });
  saveSettings(); renderSlotEditor(); renderSlots(); renderCalc();
});
function onDietChanged() { saveSettings(); renderSettings(); renderQuick(); renderIdeas(); renderCart(); renderShopResult(); }
$("diet").addEventListener("change", (e) => {
  const k = e.target.dataset.diet; if (!k) return;
  S.diet[k] = e.target.checked; onDietChanged();
});
$("diet").addEventListener("click", (e) => {
  const b = e.target.closest("[data-dtype]"); if (!b) return;
  S.diet.type = b.dataset.dtype; onDietChanged();
});
$("tasteSearch").addEventListener("input", renderTastes);
$("tastes").addEventListener("click", (e) => {
  const b = e.target.closest("[data-taste]"); if (!b) return;
  const id = b.dataset.taste, v = +b.dataset.v;
  if (S.prefs[id] === v) delete S.prefs[id]; else S.prefs[id] = v;
  saveSettings();
  for (const x of $("tastes").querySelectorAll(`[data-taste="${id}"]`)) x.setAttribute("aria-pressed", S.prefs[id] === +x.dataset.v);
  renderQuick(); renderIdeas();
});
$("copyTastes").addEventListener("click", async () => {
  const text = tastesText();
  try { await navigator.clipboard.writeText(text); } catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch {} ta.remove();
  }
  $("copyTastes").textContent = t("copied");
  setTimeout(() => { $("copyTastes").textContent = t("copyTastes"); }, 2500);
});
$("sLang").addEventListener("click", (e) => { const b = e.target.closest("[data-v]"); if (!b) return; S.lang = b.dataset.v; saveSettings(); renderAll(); });
$("sUnits").addEventListener("click", (e) => { const b = e.target.closest("[data-v]"); if (!b) return; S.units = b.dataset.v; saveSettings(); renderAll(); });
$("sTheme").addEventListener("click", (e) => { const b = e.target.closest("[data-v]"); if (!b) return; S.theme = b.dataset.v; saveSettings(); applyTheme(); renderSettings(); });
$("exportBtn").addEventListener("click", () => {
  const data = { settings: S, shopList, variety, logs: {} };
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("log-")) data.logs[k.slice(4)] = JSON.parse(localStorage.getItem(k)); } } catch {}
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  a.download = `portion-${dayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  $("exportBtn").textContent = t("exported");
  setTimeout(() => { $("exportBtn").textContent = t("export"); }, 2000);
});
$("clearLogBtn").addEventListener("click", () => {
  log = []; store.set("log-" + dayKey(), log); renderSlots(); renderLog();
  $("clearLogBtn").textContent = t("cleared");
  setTimeout(() => { $("clearLogBtn").textContent = t("clearToday"); }, 2000);
});
$("resetBtn").addEventListener("click", () => {
  if (!resetArmed) {
    resetArmed = true; $("resetBtn").textContent = t("confirm");
    setTimeout(() => { resetArmed = false; $("resetBtn").textContent = t("resetAll"); }, 4000);
    return;
  }
  try { localStorage.clear(); } catch {}
  location.reload();
});

/* ================= Démarrage ================= */
// Anciennes versions : la liste de courses stockait juste un nom et un poids
shopList = shopList.map((x) => (x.ref || !x.name ? x : { fam: x.fam, done: x.done, name: x.name, g: x.g }));
applyTheme();
slotId = guessSlot();
renderAll();
</script>
