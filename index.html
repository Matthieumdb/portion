<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Portion">
<meta name="theme-color" content="#f2f4f1">
<title>Portion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : une colonne, trois étapes (créneau → panier → doses), barre d'action collée en bas comme sur une balance */
:root {
  --bg: #f2f4f1; --surface: #ffffff; --ink: #121a16; --muted: #66736c; --line: #dfe5e0;
  --accent: #1d7a4c; --accent-soft: #e2f1e8; --accent-ink: #ffffff;
  --screen: #121a16; --screen-ink: #b4f2cb;
  --warn: #b5581c; --warn-soft: #fbeadf;
  --p: #2f6fb5; --c: #d29a17; --f: #b2476f; --k: #1d7a4c;
  --font-display: "Archivo", system-ui, sans-serif;
  --font-body: -apple-system, system-ui, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1310; --surface: #161f1a; --ink: #e8f0eb; --muted: #95a59c; --line: #26332c;
    --accent: #43c584; --accent-soft: #183326; --accent-ink: #06120b;
    --screen: #050806; --screen-ink: #9df0bf;
    --warn: #f19a60; --warn-soft: #3a2316;
    --p: #80b4f2; --c: #ecbd4f; --f: #ea88ae; --k: #43c584; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1310; --surface: #161f1a; --ink: #e8f0eb; --muted: #95a59c; --line: #26332c;
  --accent: #43c584; --accent-soft: #183326; --accent-ink: #06120b;
  --screen: #050806; --screen-ink: #9df0bf;
  --warn: #f19a60; --warn-soft: #3a2316;
  --p: #80b4f2; --c: #ecbd4f; --f: #ea88ae; --k: #43c584; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-body);
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
main { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; padding-block: 14px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font: 800 28px/1 var(--font-display); margin: 0; letter-spacing: -0.02em; }
.date { font: 500 13px var(--font-body); color: var(--muted); text-transform: capitalize; }
.step-title { display: flex; align-items: center; gap: 10px; margin: 0; font: 700 18px var(--font-display); }
.step-title .n {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--ink); color: var(--bg); font: 700 14px var(--font-display);
}
.step-title .hint { margin-left: auto; font: 500 13px var(--font-body); color: var(--muted); }
section { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* Créneaux */
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slots button {
  border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 14px; padding: 12px 6px;
  font: 700 20px var(--font-display); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.slots button small { font: 500 12px var(--font-body); color: var(--muted); }
.slots button .left { font: 600 12px var(--font-mono); color: var(--accent); }
.slots button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

/* Objectif restant : 4 jauges */
.targets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.gauge { display: flex; flex-direction: column; gap: 6px; text-align: center; min-width: 0; }
.gauge .v { font: 600 20px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.gauge .v small { font-size: 12px; margin-left: 1px; }
.gauge .l { font: 600 11px var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.gauge .track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.gauge .fill { height: 100%; border-radius: 3px; }
.caption { font-size: 13px; color: var(--muted); margin: 0; }

/* Boutons */
.btn {
  font: 700 17px var(--font-display); border: 0; border-radius: 14px; padding: 16px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn.secondary { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { font-size: 15px; padding: 11px 14px; width: auto; }
.btn svg { width: 22px; height: 22px; flex: none; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }
input {
  font: 500 17px var(--font-mono); padding: 12px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--ink); width: 100%; min-width: 0;
}
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#reader { width: 100%; border-radius: 14px; overflow: hidden; background: #000; }
#reader video { width: 100% !important; display: block; }
.error { color: var(--warn); background: var(--warn-soft); padding: 10px 12px; border-radius: 10px; font-size: 14px; margin: 0; }
.toast { color: var(--accent); background: var(--accent-soft); padding: 10px 12px; border-radius: 10px; font-size: 14px; margin: 0; font-weight: 600; }

/* Ajout rapide */
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button {
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 12px;
  font: 600 14px var(--font-body); cursor: pointer;
}
.quick button:active { background: var(--accent-soft); }

/* Panier */
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.item { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; }
.thumb {
  width: 52px; height: 52px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); overflow: hidden;
  display: grid; place-items: center; font: 800 20px var(--font-display); color: var(--muted);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.item .info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.item .name { font-weight: 650; font-size: 16px; line-height: 1.2; overflow-wrap: anywhere; }
.mix { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); }
.mix span { height: 100%; }
.item .sub { font: 500 13px var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; }
.item .actions { display: flex; align-items: center; gap: 4px; }
.icon-btn { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 8px; border-radius: 10px; font: 600 13px var(--font-body); }
.icon-btn svg { width: 20px; height: 20px; display: block; }
.fix { font: 600 12px var(--font-body); border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.fix[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
.fix-input { width: 84px; font-size: 15px; padding: 6px 8px; }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 15px; margin: 0; }
.empty b { color: var(--ink); display: block; font: 700 17px var(--font-display); margin-bottom: 4px; }
.legend { display: flex; gap: 14px; font: 500 12px var(--font-body); color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }

/* Résultat : la balance */
.doses { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.dose { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.dose .grams { background: var(--screen); color: var(--screen-ink); border-radius: 12px; padding: 8px 12px; text-align: right; min-width: 104px; }
.dose .grams b { font: 600 30px/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.dose .grams span { font: 500 14px var(--font-mono); margin-left: 3px; }
.dose .grams.zero { background: var(--bg); color: var(--muted); }
.dose .note { font: 500 12px var(--font-body); color: var(--muted); }
.dose.done { opacity: .5; }
.dose .tick { width: 22px; height: 22px; accent-color: var(--accent); }
.totals { display: flex; flex-direction: column; gap: 12px; }
.tot { display: grid; grid-template-columns: 82px 1fr 104px; gap: 10px; align-items: center; font-size: 14px; }
.tot .lbl { font-weight: 650; }
.tot .track { position: relative; height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
.tot .fill { height: 100%; border-radius: 6px; }
.tot .val { text-align: right; font: 600 14px var(--font-mono); font-variant-numeric: tabular-nums; }
.tot .val small { color: var(--muted); font-weight: 500; }
.verdict { display: flex; align-items: center; gap: 10px; font-weight: 650; margin: 0; }
.verdict .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

/* Journal */
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.log li:first-child { border-top: 0; }
.log .meta { font: 500 12px var(--font-mono); color: var(--muted); }
.log .g { font: 600 15px var(--font-mono); }

details summary { cursor: pointer; font: 700 16px var(--font-display); list-style: none; display: flex; justify-content: space-between; }
details summary::after { content: "+"; color: var(--muted); font-size: 20px; line-height: 1; }
details[open] summary::after { content: "−"; }
.tgrid { display: grid; grid-template-columns: 52px repeat(4, 1fr); gap: 6px; align-items: center; font: 600 12px var(--font-body); color: var(--muted); margin-top: 12px; }
.tgrid input { padding: 8px 6px; font-size: 15px; text-align: center; }

/* Barre d'action fixe */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.dock .inner { max-width: 540px; margin: 0 auto; display: flex; gap: 8px; }
.dock .btn.scan-btn { flex: 0 0 auto; width: auto; padding: 16px 18px; }
@media (prefers-reduced-motion: no-preference) {
  .dose, .item { animation: rise .25s ease-out both; }
  @keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Portion</h1>
    <span class="date" id="today"></span>
  </header>

  <!-- Étape 1 -->
  <section aria-labelledby="s1">
    <h2 class="step-title" id="s1"><span class="n">1</span>Quel repas ?</h2>
    <div class="slots" id="slots"></div>
    <div class="card">
      <div class="targets" id="remaining"></div>
      <p class="caption" id="remainingCaption"></p>
    </div>
  </section>

  <!-- Étape 2 : construire le repas -->
  <section aria-labelledby="s2" id="buildView">
    <h2 class="step-title" id="s2"><span class="n">2</span>Ce que tu manges<span class="hint" id="count"></span></h2>
    <div id="reader" hidden></div>
    <p class="error" id="err" hidden></p>
    <p class="toast" id="toast" hidden></p>
    <div class="card">
      <ul class="items" id="items"></ul>
      <div class="legend" id="legend" hidden><span><i style="background:var(--p)"></i>Protéines</span><span><i style="background:var(--c)"></i>Glucides</span><span><i style="background:var(--f)"></i>Lipides</span></div>
    </div>
    <div class="card">
      <span class="caption">Sans code-barres ? Ajoute en un geste (valeurs crues pour 100 g)</span>
      <div class="quick" id="quick"></div>
      <div class="row">
        <input id="codeInput" inputmode="numeric" placeholder="Code-barres à la main" aria-label="Code-barres">
        <button class="btn secondary small" id="codeBtn" type="button" style="flex:0 0 auto">Ajouter</button>
      </div>
    </div>
    <div class="card" id="manual" hidden>
      <strong>Produit introuvable. Entre ses valeurs pour 100 g :</strong>
      <input id="mName" placeholder="Nom du produit" style="font-family:var(--font-body)">
      <div class="row">
        <input id="mK" inputmode="decimal" placeholder="kcal" aria-label="kcal">
        <input id="mP" inputmode="decimal" placeholder="Prot." aria-label="Protéines">
        <input id="mC" inputmode="decimal" placeholder="Gluc." aria-label="Glucides">
        <input id="mF" inputmode="decimal" placeholder="Lip." aria-label="Lipides">
      </div>
      <div class="row">
        <button class="btn secondary" id="mCancel" type="button">Annuler</button>
        <button class="btn" id="mBtn" type="button">Ajouter au repas</button>
      </div>
    </div>
  </section>

  <!-- Étape 3 : doses -->
  <section aria-labelledby="s3" id="resultView" hidden>
    <h2 class="step-title" id="s3"><span class="n">3</span>Tes doses à peser</h2>
    <ul class="doses" id="doses"></ul>
    <div class="card totals" id="totals"></div>
  </section>

  <!-- Journal -->
  <section aria-labelledby="logh">
    <div class="card">
      <details id="logBox">
        <summary id="logh">Mangé aujourd'hui</summary>
        <ul class="log" id="log" style="margin-top:10px"></ul>
      </details>
    </div>
    <div class="card">
      <details>
        <summary>Mes objectifs par repas</summary>
        <div class="tgrid" id="tgrid"></div>
        <p class="caption" style="margin-top:10px">Total jour : <span id="tTotal"></span></p>
      </details>
    </div>
  </section>
</main>

<div class="dock">
  <div class="inner" id="dockBuild">
    <button class="btn secondary scan-btn" id="scanBtn" type="button" >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>Scanner
    </button>
    <button class="btn" id="calcBtn" type="button" disabled>Calculer</button>
  </div>
  <div class="inner" id="dockResult" hidden>
    <button class="btn secondary" id="backBtn" type="button" style="flex:0 0 38%">Modifier</button>
    <button class="btn" id="ateBtn" type="button">J'ai mangé ça</button>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const MACROS = [
  { k: "kcal", label: "Calories", short: "kcal", unit: "", color: "var(--k)" },
  { k: "p", label: "Protéines", short: "Prot.", unit: "g", color: "var(--p)" },
  { k: "c", label: "Glucides", short: "Gluc.", unit: "g", color: "var(--c)" },
  { k: "f", label: "Lipides", short: "Lip.", unit: "g", color: "var(--f)" },
];
// 2 100 kcal, P 180, G 185, L 70 répartis sur 13h / 17h / 20h
const DEFAULT_SLOTS = [
  { id: "midi", name: "13h", sub: "Repas", t: { kcal: 900, p: 70, c: 85, f: 30 } },
  { id: "goûter", name: "17h", sub: "Collation", t: { kcal: 300, p: 40, c: 15, f: 10 } },
  { id: "soir", name: "20h", sub: "Repas", t: { kcal: 900, p: 70, c: 85, f: 30 } },
];
// Valeurs crues pour 100 g (table CIQUAL, arrondies)
const QUICK = [
  { name: "Blanc de poulet", n: { kcal: 110, p: 23, c: 0, f: 1.8 } },
  { name: "Steak haché 5 %", n: { kcal: 125, p: 21, c: 0, f: 5 } },
  { name: "Riz basmati (cru)", n: { kcal: 350, p: 8, c: 77, f: 1 } },
  { name: "Pâtes (crues)", n: { kcal: 355, p: 12.5, c: 71, f: 1.5 } },
  { name: "Pommes de terre", n: { kcal: 80, p: 2, c: 17, f: 0.1 } },
  { name: "Œufs", n: { kcal: 140, p: 12.5, c: 0.5, f: 10 }, unit: { name: "œuf", g: 55, step: 55 } },
  { name: "Thon au naturel", n: { kcal: 115, p: 26, c: 0, f: 1 } },
  { name: "Skyr nature", n: { kcal: 60, p: 10.5, c: 4, f: 0.2 } },
  { name: "Huile d'olive", n: { kcal: 900, p: 0, c: 0, f: 100 }, unit: { name: "c. à soupe", g: 10, step: 5 } },
  { name: "Légumes verts", n: { kcal: 30, p: 2, c: 4, f: 0.3 }, fixed: 150 },
];
const MAX_G = 600;

const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} },
};
const dayKey = () => new Date().toLocaleDateString("fr-CA");
let slots = store.get("slots", DEFAULT_SLOTS);
let log = store.get("log-" + dayKey(), []);
let cart = store.get("cart", []);
let slotId = guessSlot();
let doses = null;
let scanner = null;

const $ = (id) => document.getElementById(id);
const r0 = (n) => Math.round(n);
const r1 = (n) => Math.round(n * 10) / 10;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function guessSlot() {
  const h = new Date().getHours();
  return h < 15 ? "midi" : h < 18 ? "goûter" : "soir";
}
const slot = () => slots.find((s) => s.id === slotId);
function eaten(filterSlot) {
  const sum = { kcal: 0, p: 0, c: 0, f: 0 };
  for (const e of log) if (!filterSlot || e.slot === filterSlot) for (const m of MACROS) sum[m.k] += e[m.k];
  return sum;
}
function remaining(id = slotId) {
  const t = slots.find((s) => s.id === id).t, e = eaten(id), r = {};
  for (const m of MACROS) r[m.k] = Math.max(0, t[m.k] - e[m.k]);
  return r;
}

/* ---------- Calcul des doses ----------
   Moindres carrés pondérés, grammes ≥ 0 : on cherche les quantités dont la somme colle
   au reste du créneau en protéines, glucides, lipides et kcal (écarts relatifs à la cible,
   protéines comptées double). Les produits à quantité fixe sont déduits avant. */
function solve(items, target, round = false) {
  const keys = ["kcal", "p", "c", "f"];
  const w = { kcal: 1, p: 2, c: 1, f: 1 };
  const t = { ...target };
  for (const it of items) if (it.fixed != null) for (const k of keys) t[k] -= it.n[k] * it.fixed / 100;
  const free = items.map((it, i) => ({ it, i })).filter((x) => x.it.fixed == null);
  const scale = {};
  for (const k of keys) scale[k] = Math.max(Math.abs(target[k]), k === "kcal" ? 100 : 5);
  const A = free.map(({ it }) => keys.map((k) => (it.n[k] / 100) * Math.sqrt(w[k]) / scale[k]));
  const b = keys.map((k) => t[k] * Math.sqrt(w[k]) / scale[k]);
  const g = free.map(() => 0);
  const ridge = 1e-6;
  for (let iter = 0; iter < 4000; iter++) {
    let moved = 0;
    for (let j = 0; j < g.length; j++) {
      let num = 0, den = ridge;
      for (let m = 0; m < 4; m++) {
        let others = 0;
        for (let q = 0; q < g.length; q++) if (q !== j) others += A[q][m] * g[q];
        num += A[j][m] * (b[m] - others);
        den += A[j][m] * A[j][m];
      }
      const next = Math.min(MAX_G, Math.max(0, num / den));
      moved = Math.max(moved, Math.abs(next - g[j]));
      g[j] = next;
    }
    if (moved < 0.01) break;
  }
  // Les produits comptés à l'unité (œufs, cuillères) sont arrondis, puis le reste est recalculé autour
  const units = free.filter(({ it }) => it.unit && it.fixed == null);
  if (units.length && units.length < free.length && !round) {
    const fixedItems = items.map((it, i) => {
      const j = free.findIndex((x) => x.i === i);
      return j >= 0 && it.unit ? { ...it, fixed: roundDose(g[j], it) } : it;
    });
    return solve(fixedItems, target, true);
  }
  const out = items.map((it) => (it.fixed != null ? it.fixed : 0));
  free.forEach(({ i }, j) => { out[i] = roundDose(g[j], items[i]); });
  return out;
}
function roundDose(g, it) {
  if (it.unit) return Math.round(g / it.unit.step) * it.unit.step;
  return g >= 100 ? Math.round(g / 5) * 5 : Math.round(g);
}

/* ---------- Rendu ---------- */
function gaugeHTML(m, value, total) {
  const pct = total ? Math.min(100, (value / total) * 100) : 0;
  return `<div class="gauge"><span class="v">${r0(value)}<small>${m.unit}</small></span>
    <div class="track"><div class="fill" style="width:${pct}%;background:${m.color}"></div></div>
    <span class="l">${m.short}</span></div>`;
}
function renderSlots() {
  $("slots").innerHTML = slots.map((s) => {
    const left = remaining(s.id).kcal;
    return `<button type="button" data-id="${s.id}" aria-pressed="${s.id === slotId}">${s.name}<small>${s.sub}</small><span class="left">${r0(left)} kcal</span></button>`;
  }).join("");
  const rem = remaining(), t = slot().t;
  $("remaining").innerHTML = MACROS.map((m) => gaugeHTML(m, rem[m.k], t[m.k])).join("");
  const done = eaten(slotId).kcal;
  $("remainingCaption").textContent = done > 0
    ? `Il te reste ça pour ${slot().name} (déjà ${r0(done)} kcal notées sur ce créneau).`
    : `Ton objectif pour le repas de ${slot().name}.`;
}
function mixHTML(n) {
  const kp = n.p * 4, kc = n.c * 4, kf = n.f * 9, sum = kp + kc + kf || 1;
  return `<div class="mix" aria-hidden="true"><span style="width:${kp / sum * 100}%;background:var(--p)"></span><span style="width:${kc / sum * 100}%;background:var(--c)"></span><span style="width:${kf / sum * 100}%;background:var(--f)"></span></div>`;
}
function thumbHTML(it) {
  return `<div class="thumb">${it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy">` : esc(it.name.trim()[0] || "?").toUpperCase()}</div>`;
}
function renderCart() {
  $("count").textContent = cart.length ? `${cart.length} produit${cart.length > 1 ? "s" : ""}` : "";
  $("legend").hidden = !cart.length;
  $("items").innerHTML = cart.length ? cart.map((it, i) => `<li class="item">
      ${thumbHTML(it)}
      <div class="info">
        <span class="name">${esc(it.name)}</span>
        ${mixHTML(it.n)}
        <span class="sub">${r0(it.n.kcal)} kcal · P ${r1(it.n.p)} · G ${r1(it.n.c)} · L ${r1(it.n.f)} /100 g</span>
        <span class="row" style="align-items:center;flex:0 0 auto">
          <button class="fix" type="button" data-fix="${i}" aria-pressed="${it.fixed != null}" style="flex:0 0 auto">${it.fixed != null ? "Quantité fixe" : "Quantité auto"}</button>
          ${it.fixed != null ? `<input class="fix-input" data-fixval="${i}" inputmode="numeric" value="${it.fixed}" aria-label="Grammes fixes" style="flex:0 0 auto"><span class="sub" style="flex:0 0 auto">g</span>` : ""}
        </span>
      </div>
      <div class="actions"><button class="icon-btn" type="button" data-del="${i}" aria-label="Retirer ${esc(it.name)}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    </li>`).join("")
    : `<li><p class="empty"><b>Ton repas est vide</b>Scanne chaque produit avec le bouton « Scanner » en bas, ou touche un aliment ci-dessous. Quand tout y est, calcule les doses.</p></li>`;
  $("calcBtn").disabled = !cart.length;
  $("calcBtn").textContent = cart.length ? `Calculer (${cart.length})` : "Calculer";
  store.set("cart", cart);
}
function renderQuick() {
  $("quick").innerHTML = QUICK.map((q, i) => `<button type="button" data-q="${i}">+ ${esc(q.name)}</button>`).join("");
}
function renderResult() {
  const show = !!doses;
  $("resultView").hidden = !show; $("buildView").hidden = show;
  $("dockResult").hidden = !show; $("dockBuild").hidden = show;
  if (!show) return;
  $("doses").innerHTML = cart.map((it, i) => {
    const g = doses[i];
    const unitTxt = it.unit && g > 0 ? `${r1(g / it.unit.g)} ${it.unit.name}${g / it.unit.g > 1 && !it.unit.name.includes(" ") ? "s" : ""}` : "";
    const raw = /riz|rice|pâtes|pasta|spaghetti|penne|fusilli|coquillettes|semoule|quinoa|lentilles|avoine|cru/i.test(it.name);
    const note = g === 0 ? "Pas besoin : le reste du repas couvre déjà tout"
      : [unitTxt, raw ? "pesé cru / sec" : "", it.fixed != null ? "quantité fixe" : ""].filter(Boolean).join(" · ");
    return `<li class="dose">${thumbHTML(it)}
      <div class="info" style="min-width:0;display:flex;flex-direction:column;gap:3px">
        <span class="name" style="font-weight:650;overflow-wrap:anywhere">${esc(it.name)}</span>
        <span class="note">${r0(it.n.kcal * g / 100)} kcal · P ${r1(it.n.p * g / 100)} g</span>
        ${note ? `<span class="note">${esc(note)}</span>` : ""}
      </div>
      <div class="grams ${g === 0 ? "zero" : ""}"><b>${g}</b><span>g</span></div></li>`;
  }).join("");
  const tot = totalsOf(doses), target = remaining();
  const worst = MACROS.reduce((acc, m) => {
    const d = target[m.k] ? (tot[m.k] - target[m.k]) / target[m.k] : 0;
    return Math.abs(d) > Math.abs(acc.d) ? { m, d } : acc;
  }, { m: null, d: 0 });
  let verdict, color;
  if (Math.abs(worst.d) <= 0.1) { verdict = "Repas pile dans tes objectifs"; color = "var(--accent)"; }
  else {
    const what = worst.m.label.toLowerCase();
    verdict = worst.d < 0
      ? `Il manque des ${what} : ajoute un produit plus riche en ${what} pour coller à l'objectif`
      : `Trop de ${what} avec ces produits : retires-en un ou fixe sa quantité plus bas`;
    color = "var(--warn)";
  }
  $("totals").innerHTML = `<p class="verdict"><span class="dot" style="background:${color}"></span>${verdict}</p>` +
    MACROS.map((m) => {
      const pct = target[m.k] ? Math.min(100, tot[m.k] / target[m.k] * 100) : 0;
      return `<div class="tot"><span class="lbl">${m.label}</span>
        <div class="track"><div class="fill" style="width:${pct}%;background:${m.color}"></div></div>
        <span class="val">${r0(tot[m.k])} <small>/ ${r0(target[m.k])}${m.unit ? " g" : ""}</small></span></div>`;
    }).join("");
}
function totalsOf(gs) {
  const t = { kcal: 0, p: 0, c: 0, f: 0 };
  cart.forEach((it, i) => { for (const m of MACROS) t[m.k] += it.n[m.k] * gs[i] / 100; });
  return t;
}
function renderLog() {
  $("log").innerHTML = log.length ? log.map((e, i) => `<li>
      <span>${esc(e.name)}<br><span class="meta">${slots.find((s) => s.id === e.slot)?.name ?? ""} · ${r0(e.kcal)} kcal · P ${r1(e.p)}</span></span>
      <span class="g">${e.g} g</span>
      <button class="icon-btn" type="button" data-logdel="${i}" aria-label="Supprimer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></li>`).join("")
    : `<li class="meta">Rien noté aujourd'hui.</li>`;
  const tot = eaten();
  $("logh").textContent = `Mangé aujourd'hui · ${r0(tot.kcal)} kcal · P ${r0(tot.p)} g`;
}
function renderTargets() {
  $("tgrid").innerHTML = `<span></span>${MACROS.map((m) => `<span style="text-align:center">${m.short}</span>`).join("")}` +
    slots.map((s, i) => `<span>${s.name}</span>${MACROS.map((m) => `<input inputmode="numeric" data-s="${i}" data-m="${m.k}" value="${s.t[m.k]}" aria-label="${s.name} ${m.label}">`).join("")}`).join("");
  const tot = { kcal: 0, p: 0, c: 0, f: 0 };
  for (const s of slots) for (const m of MACROS) tot[m.k] += s.t[m.k];
  $("tTotal").textContent = `${tot.kcal} kcal · P ${tot.p} g · G ${tot.c} g · L ${tot.f} g`;
}
function refresh() { renderSlots(); renderCart(); renderResult(); renderLog(); }

function flash(msg) {
  $("toast").textContent = msg; $("toast").hidden = false;
  clearTimeout(flash.t); flash.t = setTimeout(() => { $("toast").hidden = true; }, 2200);
}
function showErr(msg) { $("err").textContent = msg; $("err").hidden = !msg; }

function addToCart(item) {
  doses = null;
  cart.push({ ...item, fixed: item.fixed ?? null });
  renderCart(); renderResult();
  flash(`${item.name} ajouté au repas`);
}

/* ---------- Open Food Facts ---------- */
async function lookup(code) {
  code = String(code).replace(/\D/g, "");
  if (!code) return;
  showErr(""); $("manual").hidden = true;
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_fr,brands,nutriments,image_front_small_url`);
    const data = await res.json();
    const p = data.product, nu = p?.nutriments;
    const kcal = nu?.["energy-kcal_100g"] ?? (nu?.["energy_100g"] ? nu["energy_100g"] / 4.184 : undefined);
    if (data.status !== 1 || kcal == null) {
      openManual(code, p?.product_name_fr || p?.product_name || "");
      showErr(data.status === 1 ? "Produit trouvé, mais sans valeurs nutritionnelles." : "Ce produit n'est pas dans Open Food Facts.");
      return;
    }
    addToCart({
      code, name: p.product_name_fr || p.product_name || "Produit sans nom", img: p.image_front_small_url || "",
      n: { kcal: +kcal, p: +(nu.proteins_100g ?? 0), c: +(nu.carbohydrates_100g ?? 0), f: +(nu.fat_100g ?? 0) },
    });
    $("codeInput").value = "";
  } catch {
    openManual(code, "");
    showErr("Pas de connexion à Open Food Facts. Entre les valeurs à la main.");
  }
}
function openManual(code, name) {
  $("manual").hidden = false; $("manual").dataset.code = code; $("mName").value = name;
  for (const id of ["mK", "mP", "mC", "mF"]) $(id).value = "";
  $("manual").scrollIntoView({ behavior: "smooth", block: "center" });
}

/* ---------- Scanner ---------- */
async function startScan() {
  if (scanner) return stopScan();
  if (!window.Html5Qrcode) return showErr("Le scanner n'a pas chargé. Tape le code à la main.");
  showErr(""); doses = null; renderResult();
  $("reader").hidden = false;
  $("reader").scrollIntoView({ behavior: "smooth", block: "start" });
  scanner = new Html5Qrcode("reader", { formatsToSupport: [
    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E ], verbose: false });
  try {
    await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 260, height: 140 } }, async (text) => {
      await stopScan();
      if (navigator.vibrate) navigator.vibrate(60);
      lookup(text);
    });
  } catch {
    await stopScan();
    showErr("Caméra refusée. Autorise-la dans Réglages > Safari > Caméra, ou tape le code.");
  }
}
async function stopScan() {
  if (scanner) { try { await scanner.stop(); scanner.clear(); } catch {} }
  scanner = null;
  $("reader").hidden = true;
}

/* ---------- Événements ---------- */
$("slots").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  slotId = b.dataset.id;
  if (doses) doses = solve(cart, remaining());
  refresh();
});
$("quick").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const q = QUICK[+b.dataset.q];
  addToCart({ name: q.name, n: { ...q.n }, unit: q.unit || null, fixed: q.fixed ?? null });
});
$("items").addEventListener("click", (e) => {
  const del = e.target.closest("[data-del]");
  if (del) { cart.splice(+del.dataset.del, 1); doses = null; return refresh(); }
  const fix = e.target.closest("[data-fix]");
  if (fix) {
    const it = cart[+fix.dataset.fix];
    it.fixed = it.fixed != null ? null : (it.unit ? it.unit.g : 100);
    doses = null; renderCart();
  }
});
$("items").addEventListener("change", (e) => {
  const i = e.target.dataset.fixval; if (i == null) return;
  const v = parseFloat(e.target.value);
  cart[+i].fixed = v >= 0 ? v : 0; renderCart();
});
$("scanBtn").addEventListener("click", startScan);
$("codeBtn").addEventListener("click", () => lookup($("codeInput").value));
$("codeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") lookup($("codeInput").value); });
$("mCancel").addEventListener("click", () => { $("manual").hidden = true; showErr(""); });
$("mBtn").addEventListener("click", () => {
  const v = (id) => parseFloat(String($(id).value).replace(",", ".")) || 0;
  if (!v("mK")) return showErr("Entre au moins les kcal pour 100 g.");
  showErr(""); $("manual").hidden = true;
  addToCart({ code: $("manual").dataset.code || "", name: $("mName").value.trim() || "Produit perso",
    n: { kcal: v("mK"), p: v("mP"), c: v("mC"), f: v("mF") } });
});
$("calcBtn").addEventListener("click", async () => {
  await stopScan();
  doses = solve(cart, remaining());
  renderResult();
  window.scrollTo({ top: 0, behavior: "smooth" });
});
$("backBtn").addEventListener("click", () => { doses = null; renderResult(); });
$("ateBtn").addEventListener("click", () => {
  cart.forEach((it, i) => {
    const g = doses[i]; if (!(g > 0)) return;
    log.push({ name: it.name, slot: slotId, g, kcal: it.n.kcal * g / 100, p: it.n.p * g / 100, c: it.n.c * g / 100, f: it.n.f * g / 100 });
  });
  store.set("log-" + dayKey(), log);
  cart = []; doses = null;
  refresh();
  window.scrollTo({ top: 0, behavior: "smooth" });
  flash("Repas noté. Bon appétit !");
});
$("log").addEventListener("click", (e) => {
  const b = e.target.closest("[data-logdel]"); if (!b) return;
  log.splice(+b.dataset.logdel, 1); store.set("log-" + dayKey(), log); refresh();
});
$("tgrid").addEventListener("change", (e) => {
  const i = e.target.dataset.s, m = e.target.dataset.m; if (i == null) return;
  const val = parseFloat(e.target.value); if (!(val >= 0)) return;
  slots[i].t[m] = val; store.set("slots", slots); renderTargets(); refresh();
});

$("today").textContent = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
renderQuick(); renderTargets(); refresh();
</script>
</body>
</html>
